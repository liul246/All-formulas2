<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icon Generator</title>
<style>
  body { font-family: system-ui; background: #0a0a0f; color: #fff; padding: 20px; text-align: center; }
  h1 { font-size: 20px; margin-bottom: 10px; }
  p { color: #8e8e93; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
  button {
    padding: 16px 32px; background: linear-gradient(135deg, #0a84ff, #ff9f0a);
    color: #fff; border: none; border-radius: 12px; font-size: 18px;
    font-weight: 700; cursor: pointer; width: 100%; max-width: 400px;
    box-shadow: 0 8px 24px rgba(10,132,255,.4);
  }
  button:active { transform: scale(.97); }
  .status { margin-top: 20px; color: #30d158; font-weight: 600; }
  canvas { display: none; }
</style>
</head>
<body>
<h1>🎨 Icon Generator</h1>
<p>አንድ ጊዜ ንካ → ሁለት PNG ፋይሎች ይወርዳሉ፦<br><b>icon-192.png</b> እና <b>icon-512.png</b></p>
<button onclick="generate()">📥 DOWNLOAD PNG ICONS</button>
<div class="status" id="status"></div>
<canvas id="c"></canvas>

<script>
function makeIcon(size) {
  const c = document.createElement('canvas');
  c.width = size;
  c.height = size;
  const x = c.getContext('2d');

  // Dark background
  x.fillStyle = '#0a0a0f';
  x.fillRect(0, 0, size, size);

  // Gradient ring
  const grad = x.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#0a84ff');
  grad.addColorStop(1, '#ff9f0a');
  x.strokeStyle = grad;
  x.lineWidth = size * 0.04;
  x.beginPath();
  x.arc(size / 2, size / 2, size * 0.4, 0, Math.PI * 2);
  x.stroke();

  // Emoji
  x.font = `${size * 0.5}px serif`;
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillText('🧮', size / 2, size / 2 + size * 0.03);

  return c;
}

function download(canvas, name) {
  return new Promise((resolve) => {
    canvas.toBlob((blob) => {
      const a = document.createElement('a');
      a.download = name;
      a.href = URL.createObjectURL(blob);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
      setTimeout(resolve, 300);
    }, 'image/png');
  });
}

async function generate() {
  const s = document.getElementById('status');
  s.textContent = '⏳ በመፍጠር ላይ...';
  await download(makeIcon(192), 'icon-192.png');
  await download(makeIcon(512), 'icon-512.png');
  s.textContent = '✅ ተጠናቅቋል! ፋይሎቹን ወደ GitHub Upload አድርግ።';
}
</script>
</body>
</html>
