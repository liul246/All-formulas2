<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Calculator</title>
  
  <!-- Manifest እና PWA መረጃዎች -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="A fast, lightweight, and fully offline calculator app.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calculator">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .calculator {
      width: 100%;
      max-width: 360px;
      height: 100vh;
      max-height: 640px;
      background: #161b22;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .display {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      word-wrap: break-word;
      word-break: break-all;
      padding-bottom: 10px;
    }
    .history {
      color: #8b949e;
      font-size: 1.1rem;
      min-height: 24px;
    }
    .output {
      color: #ffffff;
      font-size: 2.8rem;
      font-weight: 600;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    button {
      height: 65px;
      border-radius: 16px;
      border: none;
      background: #21262d;
      color: #f0f6fc;
      font-size: 1.5rem;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.05s, background 0.1s;
    }
    button:active {
      transform: scale(0.95);
      background: #30363d;
    }
    .btn-op {
      background: #1f6feb;
      color: #ffffff;
    }
    .btn-op:active {
      background: #388bfd;
    }
    .btn-action {
      background: #da3633;
      color: #ffffff;
    }
    .btn-action:active {
      background: #f85149;
    }
  </style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="history" id="history"></div>
    <div class="output" id="output">0</div>
  </div>
  <div class="keypad">
    <button class="btn-action" onclick="clearDisplay()">C</button>
    <button onclick="appendOp('/')">÷</button>
    <button onclick="appendOp('*')">×</button>
    <button class="btn-action" onclick="deleteLast()">⌫</button>
    
    <button onclick="appendNum('7')">7</button>
    <button onclick="appendNum('8')">8</button>
    <button onclick="appendNum('9')">9</button>
    <button onclick="appendOp('-')">-</button>
    
    <button onclick="appendNum('4')">4</button>
    <button onclick="appendNum('5')">5</button>
    <button onclick="appendNum('6')">6</button>
    <button onclick="appendOp('+')">+</button>
    
    <button onclick="appendNum('1')">1</button>
    <button onclick="appendNum('2')">2</button>
    <button onclick="appendNum('3')">3</button>
    <button class="btn-op" style="grid-row: span 2; height: 100%;" onclick="calculate()">=</button>
    
    <button onclick="appendNum('0')" style="grid-column: span 2;">0</button>
    <button onclick="appendNum('.')">.</button>
  </div>
</div>

<script>
  let output = document.getElementById('output');
  let history = document.getElementById('history');
  let currentExpr = '';

  function updateDisplay() {
    output.innerText = currentExpr || '0';
  }

  function appendNum(num) {
    if (currentExpr === '0' && num !== '.') currentExpr = '';
    currentExpr += num;
    updateDisplay();
  }

  function appendOp(op) {
    if (currentExpr === '' && op !== '-') return;
    const lastChar = currentExpr.slice(-1);
    if (['+', '-', '*', '/'].includes(lastChar)) {
      currentExpr = currentExpr.slice(0, -1) + op;
    } else {
      currentExpr += op;
    }
    updateDisplay();
  }

  function clearDisplay() {
    currentExpr = '';
    history.innerText = '';
    updateDisplay();
  }

  function deleteLast() {
    currentExpr = currentExpr.slice(0, -1);
    updateDisplay();
  }

  function calculate() {
    try {
      if (!currentExpr) return;
      let result = Function('"use strict";return (' + currentExpr + ')')();
      history.innerText = currentExpr + ' =';
      currentExpr = String(result);
      updateDisplay();
    } catch (e) {
      output.innerText = 'Error';
      currentExpr = '';
    }
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

</body>
</html>
