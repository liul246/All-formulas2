<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f1f5f9; color: #1e293b;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; margin: 0; padding: 24px;
  }
  .card {
    background: #fff; padding: 32px; border-radius: 14px;
    width: 100%; max-width: 380px;
    box-shadow: 0 10px 30px rgba(15,23,42,.08);
    border: 1px solid #e2e8f0;
  }
  h1 { font-size: 1.5rem; margin: 0 0 24px; font-weight: 700; }
  label { display: block; font-size: .875rem; margin-bottom: 16px; color: #475569; font-weight: 500; }
  input {
    display: block; width: 100%; margin-top: 6px; padding: 10px 12px;
    border: 1px solid #cbd5e1; border-radius: 8px; font-size: .95rem;
    background: #fff; color: #0f172a;
  }
  input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
  button {
    width: 100%; padding: 11px; border: 0; border-radius: 8px;
    background: #3b82f6; color: #fff; font-size: 1rem; font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #2563eb; }
  #msg { margin-top: 16px; font-size: .9rem; padding: 10px 12px; border-radius: 8px; display: none; }
  #msg.ok   { display: block; background: #dcfce7; color: #166534; }
  #msg.fail { display: block; background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>
<div class="card">
  <h1>Sign in</h1>
  <label>Username
    <input id="username" autocomplete="username" spellcheck="false">
  </label>
  <label>Password
    <input id="password" type="password" autocomplete="current-password">
  </label>
  <button id="loginBtn">Sign in</button>
  <div id="msg"></div>
</div>

<script>
(function () {
  'use strict';

  var users = [
    { id: 1, username: 'admin', password: 'admin123' },
    { id: 2, username: 'alice', password: 'alicepw'  },
    { id: 3, username: 'bob',   password: 'bobpw'    }
  ];

  /* --- tiny SQL engine (only handles WHERE ... with =, !=, AND, OR) --- */

  function splitTop(str, kw) {
    var parts = [], up = str.toUpperCase(), k = kw.toUpperCase();
    var cur = '', q = false, i = 0;
    while (i < str.length) {
      var ch = str[i];
      if (ch === "'") { q = !q; cur += ch; i++; continue; }
      if (!q && up.substr(i, k.length) === k) {
        var b = i === 0 ? ' ' : str[i - 1];
        var a = (i + k.length >= str.length) ? ' ' : str[i + k.length];
        if (/\s/.test(b) && /\s/.test(a)) { parts.push(cur); cur = ''; i += k.length; continue; }
      }
      cur += ch; i++;
    }
    parts.push(cur);
    return parts;
  }

  function operand(s, row) {
    s = s.trim();
    if (s.length >= 2 && s[0] === "'" && s[s.length - 1] === "'") return s.slice(1, -1);
    if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
    var k = s.toLowerCase();
    return row.hasOwnProperty(k) ? row[k] : undefined;
  }

  function cmp(expr, row) {
    expr = expr.trim();
    if (!expr) return false;
    var m = expr.match(/^(.+?)\s*(<>|!=|=)\s*(.+)$/);
    if (!m) return false;
    var l = operand(m[1], row), r = operand(m[3], row);
    return m[2] === '=' ? l === r : l !== r;
  }

  function test(expr, row) {
    var ors = splitTop(expr, 'OR');
    for (var i = 0; i < ors.length; i++) {
      var ands = splitTop(ors[i], 'AND');
      var ok = true;
      for (var j = 0; j < ands.length; j++) {
        if (!cmp(ands[j], row)) { ok = false; break; }
      }
      if (ok) return true;
    }
    return false;
  }

  function runSQL(sql) {
    var idx = sql.toUpperCase().indexOf(' WHERE ');
    if (idx === -1) return [];
    var w = sql.slice(idx + 7);
    var c = w.indexOf('--');
    if (c !== -1) w = w.slice(0, c);
    w = w.trim();
    if (!w) return [];
    var out = [];
    for (var i = 0; i < users.length; i++) {
      if (test(w, users[i])) out.push(users[i]);
    }
    return out;
  }

  /* --- vulnerable auth (string concat, no sanitization) --- */

  function login(u, p) {
    var sql = "SELECT * FROM users WHERE username = '" + u + "' AND password = '" + p + "'";
    return runSQL(sql);
  }

  function submit() {
    var u = document.getElementById('username').value;
    var p = document.getElementById('password').value;
    var rows = login(u, p);
    var msg = document.getElementById('msg');

    if (rows.length === 0) {
      msg.className = 'fail';
      msg.textContent = 'Invalid username or password.';
      return;
    }

    msg.className = 'ok';
    msg.textContent = 'Welcome, ' + rows[0].username + '! Redirecting...';

    // login successful -> go to the app
    try { sessionStorage.setItem('user', rows[0].username); } catch (e) {}

    setTimeout(function () {
      window.location.href = 'app.html';   // <-- የአፕህ ፋይል ስም
    }, 700);
  }

  document.getElementById('loginBtn').addEventListener('click', submit);
  document.getElementById('password').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submit();
  });
})();
</script>
</body>
</html>
