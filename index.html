<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Formulas - Study Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .app-container { 
            width: 100%; 
            max-width: 420px; 
            height: 100vh; 
            max-height: 850px; 
            background: linear-gradient(to bottom, #2d3748 0%, #1a202c 40%, #0f172a 100%); 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.8); 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            overflow: hidden; 
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #3b82f6 0%, #1e3a8a 50%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease;
            text-align: center;
            padding: 20px;
        }
        #splash-screen h1 {
            font-size: 36px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        #splash-screen p {
            font-size: 15px;
            color: #93c5fd;
            margin-bottom: 40px;
        }
        .loader {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- MAIN APP CONTENT --- */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 25px 20px;
            display: none;
            padding-bottom: 80px;
        }
        .main-content.active { display: block; }

        /* Welcome Header */
        .welcome-box {
            margin-bottom: 20px;
        }
        .welcome-box h2 {
            font-size: 24px;
            color: #ffffff;
            font-weight: 700;
        }
        .welcome-box p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 3px;
        }

        /* Search Bar */
        .search-bar {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.07);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 15px;
            margin-bottom: 25px;
            outline: none;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .search-bar::placeholder { color: #94a3b8; }

        /* Categories Grid (2x2 layout) */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 15px;
        }
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .cat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .cat-card:active {
            transform: scale(0.95);
            background: rgba(59, 130, 246, 0.2);
        }
        .cat-card .icon { font-size: 28px; margin-bottom: 8px; }
        .cat-card h3 { font-size: 15px; color: #ffffff; margin-bottom: 4px; }
        .cat-card span { font-size: 11px; color: #94a3b8; }

        /* Formula Items List */
        .formula-list { display: none; margin-top: 15px; }
        .formula-item {
            background: rgba(255, 255, 255, 0.04);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .formula-item h4 { color: #60a5fa; font-size: 14px; margin-bottom: 3px; }
        .formula-item p { color: #cbd5e1; font-size: 13px; }
        .back-btn {
            background: none; border: none; color: #60a5fa; font-size: 14px; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; gap: 5px;
        }

        /* --- CALCULATOR TAB --- */
        .calc-container { display: none; height: 100%; flex-direction: column; }
        .calc-container.active { display: flex; }
        #calcDisplay {
            width: 100%;
            height: 70px;
            background: rgba(0,0,0,0.3);
            color: #4ade80;
            font-size: 28px;
            text-align: right;
            padding: 15px;
            border-radius: 14px;
            border: none;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            flex: 1;
        }
        .calc-btn {
            background: rgba(255, 255, 255, 0.07);
            color: white;
            font-size: 20px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .calc-btn:active { background: rgba(255, 255, 255, 0.2); }
        .calc-btn.op { background: rgba(59, 130, 246, 0.3); color: #93c5fd; }
        .calc-btn.eq { background: #3b82f6; color: white; grid-column: span 2; }

        /* --- NOTES TAB --- */
        .notes-container { display: none; height: 100%; flex-direction: column; }
        .notes-container.active { display: flex; }
        #noteInput {
            width: 100%;
            height: 180px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            padding: 15px;
            border-radius: 14px;
            border: none;
            resize: none;
            font-size: 14px;
            outline: none;
            margin-bottom: 15px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .save-note-btn {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .saved-notes-box {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 14px;
            flex: 1;
            overflow-y: auto;
            font-size: 13px;
            color: #cbd5e1;
        }

        /* --- BOTTOM NAVIGATION BAR --- */
        .bottom-nav {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            height: 70px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .nav-item {
            background: none;
            border: none;
            color: #64748b;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            transition: 0.3s;
        }
        .nav-item span { font-size: 11px; font-weight: 500; }
        .nav-item.active { color: #3b82f6; }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- 1. SPLASH SCREEN -->
    <div id="splash-screen">
        <h1>All Formulas</h1>
        <p>Calculations & Smart Study Hub</p>
        <div class="loader"></div>
    </div>

    <!-- TAB 1: HOME / CATEGORIES -->
    <div id="tab-home" class="main-content active">
        <div class="welcome-box">
            <h2>Welcome, Akalewold!</h2>
            <p>የተሟሉ የትምህርት ቀመሮች እና መሣሪያዎች</p>
        </div>

        <input type="text" class="search-bar" id="mainSearch" placeholder="ቀመር ፈልግ (ለምሳሌ: ፊዚክስ፣ ኬሚስትሪ)..." onkeyup="searchFormulas()">

        <div id="categoriesView">
            <div class="section-title">የምርጫ ክፍሎች (Categories)</div>
            <div class="categories-grid">
                <div class="cat-card" onclick="openCategory('physics')">
                    <div class="icon">⚡</div>
                    <h3>Physics</h3>
                    <span>150+ ቀመሮች</span>
                </div>
                <div class="cat-card" onclick="openCategory('chemistry')">
                    <div class="icon">🧪</div>
                    <h3>Chemistry</h3>
                    <span>200+ ቀመሮች</span>
                </div>
                <div class="cat-card" onclick="openCategory('math')">
                    <div class="icon">📐</div>
                    <h3>Mathematics</h3>
                    <span>350+ ቀመሮች</span>
                </div>
                <div class="cat-card" onclick="openCategory('economics')">
                    <div class="icon">📊</div>
                    <h3>Economics</h3>
                    <span>100+ ቀመሮች</span>
                </div>
            </div>
        </div>

        <!-- Formulas Details View -->
        <div id="formulaDetailView" class="formula-list">
            <button class="back-btn" onclick="backToCategories()">← ወደ ዋናው ገጽ ተመለስ</button>
            <div id="formulaContainer"></div>
        </div>
    </div>

    <!-- TAB 2: CALCULATOR -->
    <div id="tab-calc" class="main-content calc-container">
        <div class="welcome-box" style="margin-bottom: 10px;">
            <h2>Smart Calculator</h2>
        </div>
        <input type="text" id="calcDisplay" readonly>
        <div class="calc-grid">
            <button class="calc-btn" onclick="clearCalc()">C</button>
            <button class="calc-btn op" onclick="appendCalc('(')">(</button>
            <button class="calc-btn op" onclick="appendCalc(')')">)</button>
            <button class="calc-btn op" onclick="appendCalc('/')">÷</button>
            <button class="calc-btn" onclick="appendCalc('7')">7</button>
            <button class="calc-btn" onclick="appendCalc('8')">8</button>
            <button class="calc-btn" onclick="appendCalc('9')">9</button>
            <button class="calc-btn op" onclick="appendCalc('*')">×</button>
            <button class="calc-btn" onclick="appendCalc('4')">4</button>
            <button class="calc-btn" onclick="appendCalc('5')">5</button>
            <button class="calc-btn" onclick="appendCalc('6')">6</button>
            <button class="calc-btn op" onclick="appendCalc('-')">-</button>
            <button class="calc-btn" onclick="appendCalc('1')">1</button>
            <button class="calc-btn" onclick="appendCalc('2')">2</button>
            <button class="calc-btn" onclick="appendCalc('3')">3</button>
            <button class="calc-btn op" onclick="appendCalc('+')">+</button>
            <button class="calc-btn" onclick="appendCalc('0')">0</button>
            <button class="calc-btn" onclick="appendCalc('.')">.</button>
            <button class="calc-btn eq" onclick="calculateResult()">=</button>
        </div>
    </div>

    <!-- TAB 3: NOTES -->
    <div id="tab-notes" class="main-content notes-container">
        <div class="welcome-box">
            <h2>Study Notes</h2>
            <p>አስፈላጊ ማስታወሻዎችዎን ያስቀምጡ</p>
        </div>
        <textarea id="noteInput" placeholder="ማስታወሻዎትን እዚህ ይጻፉ..."></textarea>
        <button class="save-note-btn" onclick="saveNote()">ማስታወሻውን አስቀምጥ</button>
        <div class="saved-notes-box" id="savedNotesDisplay">የተቀመጠ ማስታወሻ የለም።</div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home', this)">
            🏠
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="switchTab('calc', this)">
            🔢
            <span>Calc</span>
        </button>
        <button class="nav-item" onclick="switchTab('notes', this)">
            ✏️
            <span>Notes</span>
        </button>
    </div>

</div>

<script>
    // Splash Screen Timer (Disappears after 2.5 seconds)
    setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        splash.style.opacity = '0';
        setTimeout(() => splash.style.display = 'none', 800);
    }, 2500);

    // Tab Navigation Logic
    function switchTab(tabName, btnElement) {
        document.querySelectorAll('.main-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

        if(tabName === 'home') document.getElementById('tab-home').classList.add('active');
        if(tabName === 'calc') document.getElementById('tab-calc').classList.add('active');
        if(tabName === 'notes') document.getElementById('tab-notes').classList.add('active');

        btnElement.classList.add('active');
    }

    // Comprehensive Formula Data Mock (Simulating 1000+ formulas)
    const formulaDatabase = {
        physics: [
            { title: "የፍጥነት ቀመር (Velocity)", desc: "v = s / t (ፍጥነት = ርቀት / ጊዜ)" },
            { title: "የጅምላ-ጉልበት እኩልታ (Mass-Energy)", desc: "E = mc² (አንስታይን)" },
            { title: "የኒውተን ሁለተኛ ህግ (Force)", desc: "F = m × a (ጉልበት = ጅምላ × ቅጥፈት)" },
            { title: "የኪነቲክ ሃይል (Kinetic Energy)", desc: "KE = 0.5 × m × v²" }
        ],
        chemistry: [
            { title: "የሞል ማሰልጠኛ (Moles)", desc: "n = m / M (ሞል = የተሰጠው ማስ / ሞላር ማስ)" },
            { title: "የቦይል ህግ (Boyle's Law)", desc: "P₁V₁ = P₂V₂ (የሙቀት መጠን ቋሚ ሲሆን)" },
            { title: "የጋዝ አጠቃላይ እኩልታ", desc: "PV = nRT" }
        ],
        math: [
            { title: "የክብ ስፋት (Area of Circle)", desc: "A = π × r²" },
            { title: "የፓይታጎረስ ቲዎረም (Pythagoras)", desc: "a² + b² = c²" },
            { title: "የኩብ መጠን (Volume of Cube)", desc: "V = s³" }
        ],
        economics: [
            { title: "የአርክ ኤላስቲክቲ (Arc Elasticity)", desc: "Ed = (ΔQ / ΔP) × ((P₁ + P₂) / (Q₁ + Q₂))" },
            { title: "ጠቅላላ ገቢ (Total Revenue)", desc: "TR = Price × Quantity (P × Q)" }
        ]
    };

    function openCategory(category) {
        document.getElementById('categoriesView').style.display = 'none';
        document.getElementById('mainSearch').style.display = 'none';
        
        const detailView = document.getElementById('formulaDetailView');
        const container = document.getElementById('formulaContainer');
        detailView.style.display = 'block';

        container.innerHTML = '';
        formulaDatabase[category].forEach(item => {
            container.innerHTML += `
                <div class="formula-item">
                    <h4>${item.title}</h4>
                    <p>${item.desc}</p>
                </div>
            `;
        });
    }

    function backToCategories() {
        document.getElementById('formulaDetailView').style.display = 'none';
        document.getElementById('categoriesView').style.display = 'block';
        document.getElementById('mainSearch').style.display = 'block';
    }

    function searchFormulas() {
        let query = document.getElementById('mainSearch').value.toLowerCase();
        if(query.trim() === '') return;
        // Search execution logic across categories can be expanded here
    }

    // Calculator Functions
    const calcDisplay = document.getElementById('calcDisplay');
    function appendCalc(val) { calcDisplay.value += val; }
    function clearCalc() { calcDisplay.value = ''; }
    function calculateResult() {
        try { calcDisplay.value = eval(calcDisplay.value); } 
        catch { calcDisplay.value = 'ስህተት (Error)'; }
    }

    // Notes LocalStorage Functions
    function saveNote() {
        let noteText = document.getElementById('noteInput').value;
        if(noteText.trim() !== '') {
            localStorage.setItem('akalewold_study_note', noteText);
            document.getElementById('savedNotesDisplay').textContent = noteText;
            alert('ማስታወሻው በተሳካ ሁኔታ ተቀምጧል!');
        }
    }

    window.onload = function() {
        let saved = localStorage.getItem('akalewold_study_note');
        if(saved) {
            document.getElementById('savedNotesDisplay').textContent = saved;
            document.getElementById('noteInput').value = saved;
        }
    }
</script>

</body>
</html>
