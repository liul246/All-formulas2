<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Skyline Sprint</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #gameContainer { position: relative; width: 100%; max-width: 800px; height: 400px; background: linear-gradient(to bottom, #2b1055, #7597de); overflow: hidden; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Background City Skyline */
        .city { position: absolute; bottom: 80px; width: 200%; height: 200px; background: repeating-linear-gradient(90deg, #180b30 0px, #180b30 40px, transparent 40px, transparent 60px, #231145 60px, #231145 110px); animation: moveCity 12s linear infinite; }
        @keyframes moveCity { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* Platform / Track */
        .track { position: absolute; bottom: 0; width: 200%; height: 80px; background: #34495e; border-top: 6px solid #f1c40f; animation: moveTrack 2s linear infinite; }
        @keyframes moveTrack { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* HUD - Score and Stats */
        .hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; color: white; font-weight: bold; font-size: 18px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); z-index: 10; }
        .stat-box { background: rgba(0,0,0,0.4); padding: 8px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); }

        /* Character (Abebe) */
        #player { position: absolute; bottom: 80px; left: 80px; width: 50px; height: 70px; background: #e74c3c; border-radius: 8px; border: 3px solid #f1c40f; transition: height 0.1s; z-index: 5; }
        #player::after { content: '🏃'; font-size: 40px; position: absolute; top: -5px; left: 2px; }

        /* Obstacles */
        .obstacle { position: absolute; bottom: 80px; width: 35px; height: 45px; background: #e67e22; border-radius: 5px; border: 2px solid #d35400; z-index: 4; }

        /* Controls */
        .controls { position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 10; }
        .btn { width: 75px; height: 75px; border-radius: 50%; background: #3498db; color: white; font-weight: bold; border: 3px solid #fff; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); active: transform(scale(0.95)); }
        #jumpBtn { background: #2ecc71; }
        
        /* Game Over Screen */
        #gameOverScreen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
        #restartBtn { margin-top: 15px; padding: 10px 25px; font-size: 18px; background: #e74c3c; color: white; border: none; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="hud">
        <div class="stat-box">SCORE: <span id="score">0</span></div>
        <div class="stat-box">COINS: <span id="coins">0</span></div>
    </div>

    <div class="city"></div>
    <div class="track"></div>
    <div id="player"></div>

    <div class="controls">
        <button class="btn" id="slideBtn" onmousedown="slide()" onmouseup="standUp()" ontouchstart="slide()" ontouchend="standUp()">SLIDE</button>
        <button class="btn" id="jumpBtn" onclick="jump()">JUMP</button>
    </div>

    <div id="gameOverScreen">
        <h1>GAME OVER 💥</h1>
        <p>የተሰበሰበ ነጥብ: <span id="finalScore">0</span></p>
        <button id="restartBtn" onclick="restartGame()">እንደገና ጀምር</button>
    </div>
</div>

<script>
    const player = document.getElementById('player');
    const scoreText = document.getElementById('score');
    const coinsText = document.getElementById('coins');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScore = document.getElementById('finalScore');
    const container = document.getElementById('gameContainer');

    let isJumping = false;
    let isSliding = false;
    let score = 0;
    let coins = 0;
    let gameInterval;
    let obstacleTimeout;
    let isGameOver = false;

    // Jump Function
    function jump() {
        if (isJumping || isSliding || isGameOver) return;
        isJumping = true;
        let position = 80;
        let timer = setInterval(() => {
            if (position >= 220) {
                clearInterval(timer);
                let downTimer = setInterval(() => {
                    if (position <= 80) {
                        clearInterval(downTimer);
                        isJumping = false;
                    }
                    position -= 8;
                    player.style.bottom = position + 'px';
                }, 20);
            }
            position += 12;
            player.style.bottom = position + 'px';
        }, 20);
    }

    // Slide Function
    function slide() {
        if (isJumping || isGameOver) return;
        isSliding = true;
        player.style.height = '35px';
    }

    function standUp() {
        isSliding = false;
        player.style.height = '70px';
    }

    // Generate Obstacles
    function createObstacle() {
        if (isGameOver) return;
        const obstacle = document.createElement('div');
        obstacle.classList.add('obstacle');
        container.appendChild(obstacle);

        let obstacleLeft = 800;
        obstacle.style.left = obstacleLeft + 'px';

        let timer = setInterval(() => {
            if (isGameOver) {
                clearInterval(timer);
                obstacle.remove();
                return;
            }

            if (obstacleLeft < -40) {
                clearInterval(timer);
                obstacle.remove();
                score += 10;
                if (score % 50 === 0) coins += 5;
                scoreText.textContent = score;
                coinsText.textContent = coins;
            }

            // Collision Detection
            const playerBottom = parseInt(player.style.bottom || '80');
            if (obstacleLeft > 80 && obstacleLeft < 120 && playerBottom < 120 && !isSliding) {
                endGame();
            }

            obstacleLeft -= 8;
            obstacle.style.left = obstacleLeft + 'px';
        }, 20);

        let randomTime = Math.random() * 2000 + 1000;
        obstacleTimeout = setTimeout(createObstacle, randomTime);
    }

    function endGame() {
        isGameOver = true;
        finalScore.textContent = score;
        gameOverScreen.style.display = 'flex';
    }

    function restartGame() {
        isGameOver = false;
        score = 0;
        coins = 0;
        scoreText.textContent = '0';
        coinsText.textContent = '0';
        gameOverScreen.style.display = 'none';
        document.querySelectorAll('.obstacle').forEach(o => o.remove());
        clearTimeout(obstacleTimeout);
        createObstacle();
    }

    // Keyboards Support
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') jump();
        if (e.code === 'ArrowDown') slide();
    });
    document.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowDown') standUp();
    });

    createObstacle();
</script>
</body>
</html>
